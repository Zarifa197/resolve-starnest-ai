name = "Resolve shopping history"
type = "web_pixel_extension"
runtime_context = "strict"
# Shopify CLI generates the extension uid during app deploy/link; do not invent one.
[customer_privacy]
analytics = true
marketing = true
preferences = false
sale_of_data = "disabled"
[settings]
type = "object"
[settings.fields.endpointUrl]
name = "Resolve HTTPS collector URL"
type = "single_line_text_field"
[settings.fields.shopDomain]
name = "Shopify myshopify.com domain"
type = "single_line_text_field"
